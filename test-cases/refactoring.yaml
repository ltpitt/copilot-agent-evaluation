# Refactoring test cases
# Each entry is a promptfoo test object.
# Docs: https://www.promptfoo.dev/docs/configuration/expected-outputs/

- vars:
    prompt: |
      Refactor the following Python code to use a list comprehension instead of a for loop:

      result = []
      for i in range(10):
          if i % 2 == 0:
              result.append(i * i)
  assert:
    - type: contains
      value: "["
    - type: contains
      value: "for"

- vars:
    prompt: |
      Refactor the following TypeScript function to use async/await instead of .then():

      function fetchUser(id: number) {
        return fetch(`/api/users/${id}`)
          .then(res => res.json())
          .then(data => data.user);
      }
  assert:
    - type: contains
      value: "async"
    - type: contains
      value: "await"

- vars:
    prompt: |
      Refactor the following Java methods to reduce code duplication by extracting a shared helper:

      public void printEven(int[] arr) {
          for (int i = 0; i < arr.length; i++) {
              if (arr[i] % 2 == 0) {
                  System.out.println(arr[i]);
              }
          }
      }
      public void printOdd(int[] arr) {
          for (int i = 0; i < arr.length; i++) {
              if (arr[i] % 2 != 0) {
                  System.out.println(arr[i]);
              }
          }
      }
  assert:
    - type: contains
      value: "void"
    - type: contains-any
      value:
        - "Predicate"
        - "IntPredicate"
        - "printFiltered"
        - "printMatching"
        - "print("
