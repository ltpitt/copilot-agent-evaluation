# Refactoring test cases
# Each entry is a promptfoo test object.
# Docs: https://www.promptfoo.dev/docs/configuration/expected-outputs/

- vars:
    prompt: |
      Refactor the following Python code to use a list comprehension instead of a for loop:

      result = []
      for i in range(10):
          if i % 2 == 0:
              result.append(i * i)
  assert:
    - type: contains
      value: "["
    - type: contains
      value: "for"

- vars:
    prompt: |
      Refactor the following TypeScript function to use async/await instead of .then():

      function fetchUser(id: number) {
        return fetch(`/api/users/${id}`)
          .then(res => res.json())
          .then(data => data.user);
      }
  assert:
    - type: contains
      value: "async"
    - type: contains
      value: "await"

- vars:
    prompt: |
      Refactor the following Java methods to reduce code duplication by extracting a shared helper:

      public void printEven(int[] arr) {
          for (int i = 0; i < arr.length; i++) {
              if (arr[i] % 2 == 0) {
                  System.out.println(arr[i]);
              }
          }
      }
      public void printOdd(int[] arr) {
          for (int i = 0; i < arr.length; i++) {
              if (arr[i] % 2 != 0) {
                  System.out.println(arr[i]);
              }
          }
      }
  assert:
    - type: contains
      value: "void"
    - type: contains-any
      value:
        - "Predicate"
        - "IntPredicate"
        - "printFiltered"
        - "printMatching"
        - "print("

# Fixture-based tests — source: fixtures/Sample.java, fixtures/sample.go
# These ensure the fixture files are exercised by at least one eval case.

- description: >
    Fixture (Java): refactor recursive Fibonacci to iterative.
    Source: fixtures/Sample.java
  vars:
    prompt: |
      Refactor the fibonacci method below to use iteration instead of recursion.
      Return only the updated method body, no class wrapper needed.

      public static int fibonacci(int n) {
          if (n <= 1) {
              return n;
          }
          return fibonacci(n - 1) + fibonacci(n - 2);
      }
  assert:
    - type: contains-any
      value:
        - "while"
        - "for"
    - type: not-contains
      value: "fibonacci(n - 1)"

- description: >
    Fixture (Go): refactor recursive Fibonacci to iterative.
    Source: fixtures/sample.go
  vars:
    prompt: |
      Refactor the Fibonacci function below to use iteration instead of recursion.
      Keep the same function signature.

      func Fibonacci(n int) int {
          if n <= 1 {
              return n
          }
          return Fibonacci(n-1) + Fibonacci(n-2)
      }
  assert:
    - type: contains
      value: "for"
    - type: not-contains
      value: "Fibonacci(n-1)"
