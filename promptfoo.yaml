# promptfoo configuration
# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Docs: https://www.promptfoo.dev/docs/getting-started/
# GitHub provider: https://www.promptfoo.dev/docs/providers/github/

description: GitHub Copilot / GitHub Models evaluation

# These are the models being TESTED (they generate the answers).
# All assertions are currently deterministic (contains / javascript) —
# no separate grader/judge model is involved.
# To add LLM-graded assertions (e.g. llm-rubric, factuality), set
# defaultTest.options.provider below to a separate judge model.
providers:
  - id: github:openai/gpt-4o
    config:
      temperature: 0.2
  - id: github:openai/gpt-4o-mini
    config:
      temperature: 0.2

prompts:
  - "{{prompt}}"

tests:
  - file://test-cases/coding-tasks.yaml
  - file://test-cases/challenging-tasks.yaml
  - file://test-cases/refactoring.yaml
  - file://test-cases/security.yaml
  - file://test-cases/instruction-following.yaml
  - file://test-cases/model-drift.yaml
