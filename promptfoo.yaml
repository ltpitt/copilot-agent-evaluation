# promptfoo configuration
# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Docs: https://www.promptfoo.dev/docs/getting-started/
# GitHub provider: https://www.promptfoo.dev/docs/providers/github/

description: GitHub Copilot / GitHub Models evaluation

# Models being TESTED (they generate the answers).
# For LLM-graded assertions (llm-rubric), gpt-4o-mini is used as the
# judge model via defaultTest.options.provider — it's free-tier and fast.
providers:
  - id: github:openai/gpt-4o
    config:
      temperature: 0.2
  - id: github:openai/gpt-4o-mini
    config:
      temperature: 0.2

# Judge model for llm-rubric assertions (prompt quality tests).
# This model evaluates whether prompts follow best practices.
# Using gpt-4o-mini keeps costs at zero while providing good judgment.
defaultTest:
  options:
    provider: github:openai/gpt-4o-mini

prompts:
  - "{{prompt}}"

tests:
  # Prompt quality gate — evaluates prompt quality BEFORE output quality
  - file://test-cases/prompt-quality.yaml
  # Output quality — evaluates model responses
  - file://test-cases/coding-tasks.yaml
  - file://test-cases/refactoring.yaml
  - file://test-cases/security.yaml
  - file://test-cases/instruction-following.yaml
  - file://test-cases/model-drift.yaml
