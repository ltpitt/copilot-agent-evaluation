# promptfoo configuration
# Docs: https://www.promptfoo.dev/docs/getting-started/
# GitHub provider: https://www.promptfoo.dev/docs/providers/github/

description: GitHub Copilot / GitHub Models evaluation

providers:
  - id: github:gpt-4o
    config:
      # GITHUB_TOKEN must be set in the environment
      temperature: 0.2

prompts:
  - "{{prompt}}"

tests:
  - file://test-cases/coding-tasks.yaml
  - file://test-cases/refactoring.yaml
  - file://test-cases/security.yaml
